<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Cliente</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Añadir Nuevo Cliente</h1>

        <form action="{{ url_for('add_client') }}" method="post">
            <div class="form-group">
                <label for="id">ID Cliente</label>
                <input type="number" class="form-control" id="id" name="id" required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono">
            </div>
            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" class="form-control" id="direccion" name="direccion">
            </div>
            <div class="form-group">
                <label for="tipo_cliente">Tipo de Cliente</label>
                <select class="form-control" id="tipo_cliente" name="tipo_cliente" onchange="toggleClientDetails()">
                    <option value="RegularClient">Regular</option>
                    <option value="PremiumClient">Premium</option>
                    <option value="CorporateClient">Corporativo</option>
                </select>
            </div>
            <div id="premium_details" style="display: none;">
                <div class="form-group">
                    <label for="nivel_membresia">Nivel de Membresía</label>
                    <input type="text" class="form-control" id="nivel_membresia" name="nivel_membresia">
                </div>
            </div>
            <div id="corporate_details" style="display: none;">
                <div class="form-group">
                    <label for="nombre_empresa">Nombre de la Empresa</label>
                    <input type="text" class="form-control" id="nombre_empresa" name="nombre_empresa">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Cliente</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script>
        function toggleClientDetails() {
            var tipo = document.getElementById('tipo_cliente').value;
            document.getElementById('premium_details').style.display = tipo === 'PremiumClient' ? 'block' : 'none';
            document.getElementById('corporate_details').style.display = tipo === 'CorporateClient' ? 'block' : 'none';
        }
    </script>
</body>
</html>
